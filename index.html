<body id="page-top">
    <!-- Navigation-->
    <nav class="header navbar navbar-expand-lg navbar-light fixed-top shadow-sm" id="mainNav">
        <div class="container px-5">
            <a id="page-top-title" class="navbar-brand fw-bold" href="#page-top">Zhixuan Liu</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive"
                aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                MENU <i class="bi-list"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav ms-auto me-4 my-3 my-lg-0">
                    <li class="nav-item"><a class="nav-link me-lg-3" href="#home">HOME</a></li>
                    <li class="nav-item"><a class="nav-link me-lg-3" href="#awards">AWARDS</a></li>
                    <li class="nav-item"><a class="nav-link me-lg-3" href="#experience">EXPERIENCE</a></li>

    <!-- Top Section -->
    <section class="top-section" style="background-image: url('static/assets/img/background.png'); height: 60vh; background-position: center 20%; background-size: cover;">

            <div class="container px-5">
                <h2 id="top-section-bg-text" class="text-white display-3 lh-1 font-alt"></h2>

        </div>
    </section>

    <div class="container px-5 mt-5">
        <div class="row">

            <div class="col-lg-3 pe-lg-5">
                <div class="sidebar-sticky">
                    <div id="photo" class="mb-4">
                        <img class="shadow" src="static/assets/img/photo.jpg">
                    </div>
                    <div class="sidebar-info">
                        <div id="sidebar-name" class="name">Zhixuan Liu</div>
                        <div id="sidebar-title" class="title">Undergraduate Student @ Soochow University</div>
                        <ul class="links">
                            <li><i class="bi bi-geo-alt"></i> <span>Suzhou, China</span></li>
                            <li><i class="bi bi-envelope"></i> <a id="sidebar-email" href="mailto:2427405039@stu.suda.edu.cn">Email</a></li>
                            <li><i class="bi bi-github"></i> <a href="https://github.com/Louis-zxLiu">Github</a></li>
                        </ul>
                        <hr>
                        <div class="small text-muted">
                            <p>Research Interests:<br>Computer Vision, LLM</p>
                        </div>
                    </div>
                </div>
            </div>

                <section class="bg-gradient-primary-to-secondary-light mb-5" id="home">

                        <header><h2 id="home-subtitle"> </h2></header>
                        <div class="main-body" id="home-md"></div>

                <section class="bg-gradient-primary-to-secondary-light mb-5" id="awards">
                    <div class="container">
                        <header><h2><i class="bi bi-award-fill"></i> AWARDS</h2></header>
                        <div class="main-body" id="awards-md"></div>
                    </div>
                </section>

                <section class="bg-gradient-primary-to-secondary-light mb-5" id="experience">
                    <div class="container">

                        <div class="main-body" id="experience-md"></div>
                    </div>

                    <div class="container">
                        <header><h2><i class="bi bi-file-text-fill"></i> PUBLICATIONS</h2></header>
                        
                        <div class="mb-4">
                            <button id="pub-filter-all" class="btn btn-primary btn-sm rounded-pill px-3 me-2" onclick="filterPublications('all')">All Publications</button>
                            <button id="pub-filter-selected" class="btn btn-outline-secondary btn-sm rounded-pill px-3" onclick="filterPublications('selected')">Selected Only</button>
                        </div>

                            <!-- Publications cards will be injected here -->
                        </div>
                        
                        <div class="main-body d-none" id="publications-md"></div>
                    </div>
                </section>

                        <header>

                                <h2><i class="bi bi-journal-text"></i> BLOG</h2>
                                <button id="back-to-blog-list" class="btn btn-outline-primary btn-sm" style="display: none;" onclick="showBlogList()">Back to List</button>

                        </header>
                        <div class="main-body" id="blog-list">
                            <!-- Blog list will be injected here -->
                        </div>
                        <div class="main-body" id="blog-content" style="display: none;">
                            <!-- Blog content will be injected here -->
                        </div>
                    </div>

    <footer class="bg-bottom text-center py-5">

        </div>
